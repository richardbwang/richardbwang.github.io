  <!-- CSS is inline on purpose so this page never depends on a relative path.
       The tokens copy the top of /style.css: keep them in sync. -->
  <style>
    :root {
      --ink: #0a0a0b; --line: #2a2a2f; --line-2: #3d3d44; --paper: #f1efe8; --text: #d9d6cd; --muted: #a4a29a;
      --sig: #d4ff3a; --sig-ink: #0a0a0b; --rec: #ff4a3d;
      --cond: "Archivo", "Arial Narrow", Arial, sans-serif;
      --mono: "Martian Mono", ui-monospace, Menlo, Consolas, monospace;
      color-scheme: dark;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { background: var(--ink); }
    body {
      margin: 0; min-height: 100vh; min-height: 100svh;
      display: grid; grid-template-rows: auto 1fr auto;
      color: var(--text); font: 400 18px/1.6 "Archivo", Arial, sans-serif;
      -webkit-font-smoothing: antialiased; overflow-x: clip;
      background:
        radial-gradient(80% 55% at 84% 90%, rgba(147, 38, 103, 0.28), transparent 70%),
        radial-gradient(70% 55% at 0% 0%, rgba(66, 10, 104, 0.2), transparent 70%),
        var(--ink);
    }
    .m { font-family: var(--mono); font-weight: 400; font-stretch: 87.5%; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
    .bar { display: flex; justify-content: space-between; gap: 16px; max-width: none; margin: 0; padding: 18px clamp(16px, 4vw, 56px) 12px; border-bottom: 1px solid var(--line); } /* full width: not the 60ch text measure below */
    .rec { display: inline-block; width: 7px; height: 7px; margin-right: 9px; border-radius: 50%; background: var(--rec); }
    .bar b { color: var(--sig); font-weight: 400; }
    main { align-self: center; padding: 48px clamp(16px, 4vw, 56px); max-width: 1360px; width: 100%; margin: 0 auto; }
    .big { position: relative; display: inline-block; margin: 34px 0 0; font: 800 min(38vw, 340px)/0.84 var(--cond); font-stretch: 62.5%; color: var(--paper); }
    .big::before { content: ""; position: absolute; inset: 0.02em -0.07em -0.03em; border: 1.5px dashed var(--paper); }
    .big::after { content: "page · not found"; position: absolute; left: -0.07em; bottom: calc(100% - 0.02em); margin-left: -1px; padding: 5px 7px 4px; background: var(--paper); color: var(--ink); font: 400 11px/1 var(--mono); font-stretch: 87.5%; letter-spacing: 0.06em; white-space: nowrap; }
    h1 { margin: 34px 0 0; max-width: 26ch; font: 400 clamp(26px, 3.4vw, 44px)/1.12 "Archivo", Arial, sans-serif; font-stretch: 112%; letter-spacing: -0.02em; color: var(--paper); overflow-wrap: anywhere; }
    h1 code { font: inherit; color: var(--sig); }
    p { margin: 18px 0 0; max-width: 60ch; }
    .go { display: flex; flex-wrap: wrap; gap: 10px; margin: 30px 0 0; padding: 0; list-style: none; }
    a { color: var(--paper); text-decoration: underline; text-decoration-color: rgba(212, 255, 58, 0.42); text-underline-offset: 0.22em; }
    a:hover { color: var(--sig-ink); background: var(--sig); text-decoration-color: transparent; }
    a:focus-visible { outline: 2px solid var(--sig); outline-offset: 3px; }
    .go a { display: inline-block; padding: 10px 12px 9px; border: 1px solid var(--line-2); text-decoration: none; font: 400 12px/1 var(--mono); font-stretch: 87.5%; letter-spacing: 0.06em; text-transform: uppercase; }
    .go a.home { background: var(--sig); border-color: var(--sig); color: var(--sig-ink); }
    .go a:hover { border-color: var(--sig); }
    footer { padding: 18px clamp(16px, 4vw, 56px) 22px; border-top: 1px solid var(--line); }
    .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  </style>
</head>
<body>

  <footer class="m">© 2026 Richard B. Wang</footer>
  <script>
    (function () {
      var p = location.pathname || "";
      try { p = decodeURIComponent(p); } catch (e) {}
      p = p.replace(/^\/+/, "/");
      if (!p || p === "/") return;
      if (p.length > 60) p = p.slice(0, 57) + "...";
      Array.prototype.forEach.call(document.querySelectorAll("[data-path]"), function (el) { el.textContent = p; });
    })();
  </script>
